{{ define "main" }}
<div class="list-layout">

  <header class="list-header">
    <h1 class="list-page-title">Blog</h1>
    <p class="list-page-desc">Systems, code, retro tech, and whatever else is on my mind.</p>
  </header>

  <div class="post-list">
    {{ range .Pages }}
    <div class="post-list-item">
      <span class="post-list-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      <div class="post-list-title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </div>
      {{ with .Params.tags }}
      <div class="post-list-tags">
        {{ range first 2 . }}<span class="tag">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </div>
    {{ end }}
  </div>

</div>
{{ end }}
