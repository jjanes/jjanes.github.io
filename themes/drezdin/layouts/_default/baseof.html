<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {{- if .IsHome -}}
      {{ .Site.Title }} — {{ .Site.Params.description }}
    {{- else -}}
      {{ .Title }} | {{ .Site.Title }}
    {{- end -}}
  </title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ .Site.Params.favicon | default "/favicon.ico" }}">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/syntax.css">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/index.xml">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PC1TW04WSF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PC1TW04WSF');
  </script>
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a href="/" class="nav-logo">{{ .Site.Title }}</a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
             {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{ end }}
        <li>
          <a href="https://github.com/jjanes" target="_blank" rel="noopener"
             class="nav-icon-link" aria-label="GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61
                       c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77
                       5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0
                       C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77
                       a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7
                       A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <!-- Live banner — shown by live.js when streaming -->
  <div id="live-banner" class="live-banner" style="display:none"></div>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="https://github.com/jjanes"           target="_blank" rel="noopener">GitHub</a>
        <a href="https://kick.com/drezdin"            target="_blank" rel="noopener">Kick</a>
        <a href="https://youtube.com/@drezOG"         target="_blank" rel="noopener">YouTube</a>
        <a href="https://x.com/jjfish"                target="_blank" rel="noopener">X</a>
        <a href="https://twitch.tv/jjfishii"          target="_blank" rel="noopener">Twitch</a>
        <a href="https://linkedin.com/in/johnrjanes"  target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://drezdin.com"                 target="_blank" rel="noopener">Drezdin Labs</a>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} John Janes. All rights reserved.</p>
    </div>
  </footer>

  <script>
    window.SITE_CONFIG = {
      kickUsername:     "{{ .Site.Params.kickUsername     | default "" }}",
      youtubeChannelId: "{{ .Site.Params.youtubeChannelId | default "" }}",
      youtubeApiKey:    "{{ .Site.Params.youtubeApiKey    | default "" }}"
    };
  </script>
  <script src="/js/live.js" defer></script>

</body>
</html>
